<div class="topbar d-flex justify-content-between align-items-center">
    <div class="topbar-left-actions d-flex justify-content-start align-items-center gap-2">
        <div class="collapse-container" (click)="onCollapseSidebar()">
            <img *ngIf="!isCollapsed" src="assets/sidebar-collapse.svg" />
            <img *ngIf="isCollapsed" src="assets/sidebar-expand.svg" />
        </div>
        <div class="topbar-logo">
            Craft
        </div>
    </div>
    <div class="topbar-center-actions d-flex justify-content-between align-items-center">
        <div class="search-container">
            <img src="assets/search.svg" class="search-icon" />
            <input type="text" placeholder="Search (ctrl + /)" />
        </div>
        <div class="create-container d-flex justify-content-center align-items-center">
            <span>
                + Create
            </span>
        </div>
    </div>
    <div class="topbar-right-actions">
        <div class="profile-container">

        </div>
    </div>

</div>
