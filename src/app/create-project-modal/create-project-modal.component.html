<div class="modal-container">
    <div class="create-project-modal-header d-flex justify-content-between align-items-center">
        <h4 class="m-0">Create Project</h4>
        <div class="close-button" (click)="closeModal()"></div>
    </div>
    <div class="create-project-modal-body">
        <select>
            <option *ngFor="let template of templates" [value]="template.id">
                {{ template.name }}
            </option>
        </select>
    </div>
    <div class="create-project-modal-footer">

    </div>
</div>
