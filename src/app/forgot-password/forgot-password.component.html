<div class="forgot-password-parent d-flex justify-content-center align-items-center">
    <div class="forgot-password-container">
        <form [formGroup]="emailFormGroup" class="email-form-container d-flex flex-column p-2 gap-2">
            <img src="assets/email-logo.svg" alt="Email Icon" class="email-icon">
            <div class="email-container d-flex flex-column gap-2">
                <label>Email</label>
                <input class="p-2" type="email"
                    placeholder="Enter your email address" formControlName="email" />
            </div>
            <div class="get-otp-container d-flex justify-content-center align-items-center">
                <button [disabled]="disableEmailAndOtpBtn" class="get-otp-btn" (click)="onGetOtp()">Get Otp</button>
            </div>
        </form>
        <div *ngIf="allowEnterOtp" class="otp-container d-flex flex-column gap-2 p-2">
            <div class="otp-inputs d-flex justify-content-center align-items-center gap-2">
                <input type="text" maxlength="1" class="otp-input" name="otp0" (keyup)="onOtpInput($event, 0)">
                <input type="text" maxlength="1" class="otp-input" name="otp1" (keyup)="onOtpInput($event, 1)">
                <input type="text" maxlength="1" class="otp-input" name="otp2" (keyup)="onOtpInput($event, 2)">
                <input type="text" maxlength="1" class="otp-input" name="otp3" (keyup)="onOtpInput($event, 3)">
            </div>
            <div class="verify-otp-container d-flex justify-content-center align-items-center">
                <button class="verify-otp-btn" (click)="onVerifyOtp()">Verify Otp</button>
            </div>
        </div>
    </div>
</div>
